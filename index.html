<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رثاء الطف</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <h1 class="gold-text amiri-text" data-i18n="splash_1" style="font-size: 38px; margin-bottom: 15px;">صَلِّ على نبيّكَ الأكرم</h1>
            <p class="amiri-text" data-i18n="splash_2" style="color: var(--gold); font-size: 24px; text-shadow: var(--purple-glow);">اللهم صلِّ على محمد وآل محمد</p>
        </div>
    </div>

    <header>
        <h1 id="app-title" data-i18n="app_title">رثاء الطف</h1>
    </header>

    <main id="main-content">

        <!-- التبويب 1: شعراء (القصائد) -->
        <section id="section-poets" class="tab-content active">
            <div class="search-container" style="margin-bottom: 20px; padding: 0 10px;">
                <div style="position: relative;">
                    <input type="text" id="search-community-input" data-i18n-placeholder="search_placeholder" placeholder="ابحث عن قصيدة أو شاعر..." onkeyup="searchCommunityPoems()">
                    <i class="fa-solid fa-search gold-text search-icon"></i>
                </div>
            </div>

            <div id="weekly-contest-board" style="margin-bottom: 25px;"></div>
            
            <div class="section-divider">
                <span class="gold-text" data-i18n="published_poems">القصائد المنشورة</span>
            </div>
            
            <div id="community-poems-list"></div>
        </section>

        <!-- التبويب 2: النشر -->
        <section id="section-publish" class="tab-content">
            <div id="login-container" class="form-container premium-card text-center">
                <h2 id="auth-main-title" class="gold-text" style="margin-bottom: 15px;">تسجيل الدخول</h2>
                <p class="amiri-text" style="color: var(--text-muted); margin-bottom: 25px;">يجب تسجيل الدخول لنشر القصائد أو الإعجاب بها.</p>
                
                <input type="text" id="auth-username" placeholder="اسم الحساب (مطلوب لإنشاء حساب جديد)" dir="auto" style="display: none;">
                <input type="email" id="auth-email" placeholder="البريد الإلكتروني (Email)" required dir="ltr" style="text-align: start;">
                <input type="password" id="auth-pass" placeholder="كلمة المرور (Password)" required dir="ltr" style="text-align: start;">
                
                <div id="login-btns-group" class="btn-group">
                    <button type="button" onclick="loginUser()" class="gold-btn btn-half">دخول</button>
                    <button type="button" onclick="toggleAuthMode('register')" class="gold-btn btn-half secondary-btn">حساب جديد</button>
                </div>

                <div id="register-btns-group" class="btn-group" style="display: none;">
                    <button type="button" onclick="registerUser()" class="gold-btn btn-half secondary-btn">تأكيد التسجيل</button>
                    <button type="button" onclick="toggleAuthMode('login')" class="gold-btn btn-half outline-btn">رجوع</button>
                </div>

                <button type="button" id="forgot-btn" onclick="resetPasswordPrompt()" class="forgot-btn">نسيت كلمة المرور؟</button>
            </div>

            <div id="publish-container" class="form-container premium-card" style="display: none; padding: 20px;">
                <div class="flex-between" style="margin-bottom: 15px;">
                    <h2 class="gold-text" data-i18n="publish_main_title" style="margin: 0;">انشر موهبتك</h2>
                    <button type="button" onclick="logoutUser()" class="logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="logout_text">خروج</span>
                    </button>
                </div>
                <input type="text" id="pub-name" data-i18n-placeholder="pub_name_ph" placeholder="اسم الشاعر" required>
                <input type="text" id="pub-title" data-i18n-placeholder="pub_title_ph" placeholder="اسم القصيدة" required>
                <textarea id="pub-poem" data-i18n-placeholder="pub_poem_ph" placeholder="اكتب القصيدة كاملة هنا..." rows="8" required></textarea>
                <button type="button" onclick="submitPoem()" id="pub-btn" class="gold-btn" data-i18n="pub_btn">نشر القصيدة</button>
            </div>
        </section>

        <!-- التبويب 3: الإعدادات -->
        <section id="section-settings" class="tab-content">
            <div class="premium-card text-center" style="padding: 20px;">
                <h3 id="quote-title" data-i18n="quote_title" class="gold-text" style="margin-bottom: 10px;">حكمة اليوم</h3>
                <p id="quote-text" class="amiri-text" style="color: var(--text-main);">يتم التحميل...</p>
            </div>

            <div class="settings-list">
                <div class="setting-item">
                    <span data-i18n="account_name">اسم الحساب</span>
                    <span id="display-username" class="gold-text" style="font-weight: bold;">غير مسجل</span>
                </div>
                
                <div onclick="openTikTok()" class="setting-item cursor-pointer">
                    <span data-i18n="contact_dev">مراسلة المطور</span>
                    <div class="flex-align-center" style="gap: 8px;">
                        <span style="color: #ccc; font-size: 13px;">@KENO_ZERO</span>
                        <i class="fa-brands fa-tiktok gold-text"></i>
                    </div>
                </div>

                <div class="setting-item">
                    <span data-i18n="language">اللغة</span>
                    <select id="language-select" onchange="changeLanguage(this.value)">
                        <option value="ar">العربية</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="setting-item">
                    <span data-i18n="theme">المظهر</span>
                    <select id="theme-select" onchange="changeTheme()">
                        <option value="dark" data-i18n="theme_dark">داكن ملكي</option>
                        <option value="light" data-i18n="theme_light">أبيض</option>
                    </select>
                </div>
                <div class="setting-item">
                    <span data-i18n="version">إصدار التطبيق</span>
                    <span class="gold-text">v1.0.0</span>
                </div>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('poets', this)">
            <i class="fa-solid fa-feather"></i>
            <span class="nav-text" data-i18n="tab_poets">شعراء</span>
        </button>
        <button class="nav-item" onclick="switchTab('publish', this)">
            <i class="fa-solid fa-pen-nib"></i>
            <span class="nav-text" data-i18n="tab_publish">نشر</span>
        </button>
        <button class="nav-item" onclick="switchTab('settings', this)">
            <i class="fa-solid fa-gear"></i>
            <span class="nav-text" data-i18n="tab_settings">إعدادات</span>
        </button>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="script.js"></script>
</body>
</html>
